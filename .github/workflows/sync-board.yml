# Espelha docs/roadmap.md no board do GitHub Projects (scripts/sync-board.sh).
#
# - push na main: roadmap da main (merge de uma task);
# - pull_request: roadmap do head do PR (é assim que "review" aparece no board);
# - issues labeled/unlabeled com status:doing: "doing" enquanto a task não tem PR;
# - workflow_dispatch: à mão.
#
# Precisa do secret PROJECT_TOKEN (o GITHUB_TOKEN padrão não acessa Projects de
# usuário) e de scripts/board.conf. Sem um dos dois, termina verde com um aviso.
name: Sync board

on:
  push:
    branches: [main]
    paths: [docs/roadmap.md]
  pull_request:
    types: [opened, reopened, synchronize]
    paths: [docs/roadmap.md]
  issues:
    types: [labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: sync-board
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.event_name != 'issues' || github.event.label.name == 'status:doing'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Sincroniza o board
        run: |
          if [ ! -f scripts/board.conf ]; then
            echo "::warning::Sem scripts/board.conf: rode ./scripts/bootstrap.sh localmente e faça commit do arquivo. Sync pulado."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Secret PROJECT_TOKEN não configurado (veja o README). Sync pulado."
            exit 0
          fi
          ./scripts/sync-board.sh
