name: Task
description: Registro de uma task de docs/tasks/ (o conteúdo vive no arquivo, não aqui)
title: "NNN · "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        A issue é só registro. Objetivo, escopo e critérios de aceite ficam em `docs/tasks/NNN-<slug>.md`.
        Prefira `./scripts/create-issue.sh docs/tasks/NNN-<slug>.md`, que já grava o número no roadmap.
        Se criar por aqui, anote o número no frontmatter e na coluna Issue do roadmap; o board é atualizado pelo Action.
  - type: input
    id: spec
    attributes:
      label: Arquivo da task
      placeholder: docs/tasks/002-tela-login.md
    validations:
      required: true
