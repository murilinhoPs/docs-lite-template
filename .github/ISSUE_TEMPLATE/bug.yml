name: Bug
description: Algo não funciona como a spec diz
title: "[bug] "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Depois de criar, inclua a issue no roadmap: `./scripts/new-issue.sh --existing <N> [--after <issue>]`.
  - type: input
    id: spec
    attributes:
      label: Spec
      placeholder: docs/specs/auth.md  (F2)
  - type: input
    id: area
    attributes:
      label: Área
      placeholder: area:auth
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Esperado vs. obtido
      description: Cite os critérios de aceite violados (ex.: AC-F2-03)
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Prints ou logs
      description: Arraste a imagem aqui (fica como anexo da issue, não vai para o repo)
